name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  repository-contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Static repository contracts
        run: python scripts/verify.py
      - name: Ensure manifest is current
        run: python scripts/generate_manifest.py --check

  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'
      - name: Restore
        working-directory: backend
        run: dotnet restore Qasedak.slnx
      - name: Build
        working-directory: backend
        run: dotnet build Qasedak.slnx -c Release --no-restore
      - name: Format check
        working-directory: backend
        run: dotnet format Qasedak.slnx --verify-no-changes --no-restore
      - name: Test
        working-directory: backend
        run: dotnet test Qasedak.slnx -c Release --no-build --logger "trx;LogFileName=tests.trx"

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend/Qasedak.Web
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Install baseline dependencies
        run: npm ci --no-audit --no-fund
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  docker:
    runs-on: ubuntu-latest
    needs: [repository-contracts, backend, frontend]
    steps:
      - uses: actions/checkout@v5
      - name: Build API image
        run: docker build -t qasedak-api:ci backend
      - name: Build web image
        run: docker build -t qasedak-web:ci frontend/Qasedak.Web
