name: CI

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

jobs:
  repository-contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - name: Static repository contracts
        run: python scripts/verify.py
      - name: Ensure manifest is current
        run: python scripts/generate_manifest.py --check
      - name: Architecture boundaries
        run: python scripts/check_architecture.py
      - name: Environment contract
        run: python scripts/check_environment_contract.py

  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'
      - name: Deny live Meta endpoints
        shell: bash
        run: |
          printf '127.0.0.1 graph.instagram.com api.instagram.com graph.facebook.com www.instagram.com\n' | sudo tee -a /etc/hosts
          printf '::1 graph.instagram.com api.instagram.com graph.facebook.com www.instagram.com\n' | sudo tee -a /etc/hosts
          for host in graph.instagram.com api.instagram.com graph.facebook.com www.instagram.com; do
            getent hosts "$host" | grep -Eq '(^|[[:space:]])(127\.0\.0\.1|::1)([[:space:]]|$)'
          done
      - name: Restore
        working-directory: backend
        run: dotnet restore Qasedak.slnx
      - name: Build
        working-directory: backend
        run: dotnet build Qasedak.slnx -c Release --no-restore
      - name: Format check
        working-directory: backend
        run: dotnet format Qasedak.slnx --verify-no-changes --no-restore
      - name: Test
        working-directory: backend
        run: dotnet test Qasedak.slnx -c Release --no-build --logger "trx;LogFileName=tests.trx"

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend/Qasedak.Web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/Qasedak.Web/package-lock.json
      - name: Install baseline dependencies
        run: npm ci --no-audit --no-fund
      - name: Frontend verification
        run: npm run verify

  docker:
    runs-on: ubuntu-latest
    needs: [repository-contracts, backend, frontend]
    steps:
      - uses: actions/checkout@v7
      - name: Build API image
        run: docker build -t qasedak-api:ci backend
      - name: Build web image
        run: docker build -t qasedak-web:ci frontend/Qasedak.Web
