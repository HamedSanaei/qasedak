name: CodeQL

# PRs are validated by CI; CodeQL runs on master pushes, weekly, and manually.
# No branch-protection config in this repository requires CodeQL on pull requests.
on:
  push:
    branches: [master]
  schedule:
    - cron: '23 3 * * 2'
  workflow_dispatch:

permissions:
  security-events: write
  packages: read
  actions: read
  contents: read

jobs:
  analyze:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        language: [csharp, javascript-typescript]
    steps:
      - uses: actions/checkout@v7
      - uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
      - uses: github/codeql-action/autobuild@v4
      - uses: github/codeql-action/analyze@v4
