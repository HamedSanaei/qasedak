name: qasedak

services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-qasedak}
      POSTGRES_USER: ${POSTGRES_USER:-qasedak}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me-for-local-only}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - qasedak-postgres:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-qasedak} -d ${POSTGRES_DB:-qasedak}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__Qasedak: Host=postgres;Port=5432;Database=${POSTGRES_DB:-qasedak};Username=${POSTGRES_USER:-qasedak};Password=${POSTGRES_PASSWORD:-change-me-for-local-only}
      Cors__AllowedOrigins__0: http://localhost:${WEB_PORT:-3000}
      # Payments (ADR-008): secrets arrive via environment only; callbacks carry no secrets.
      Billing__Payments__CallbackBaseUrl: ${BILLING_CALLBACK_BASE_URL:-http://localhost:${API_PORT:-8080}}
      Billing__Payments__FrontendBaseUrl: ${BILLING_FRONTEND_BASE_URL:-http://localhost:${WEB_PORT:-3000}}
      Billing__Payments__Zarinpal__Enabled: ${ZARINPAL_ENABLED:-false}
      Billing__Payments__Zarinpal__MerchantId: ${ZARINPAL_MERCHANT_ID:-}
      Billing__Payments__Zarinpal__BaseUrl: ${ZARINPAL_BASE_URL:-https://payment.zarinpal.com}
      Billing__Payments__Zarinpal__Currency: ${ZARINPAL_CURRENCY:-IRR}
      Billing__Payments__Melli__Enabled: ${MELLI_ENABLED:-false}
      Billing__Payments__Melli__MerchantId: ${MELLI_MERCHANT_ID:-}
      Billing__Payments__Melli__TerminalId: ${MELLI_TERMINAL_ID:-}
      Billing__Payments__Melli__CredentialKey: ${MELLI_CREDENTIAL_KEY:-}
      Billing__Payments__Melli__BaseUrl: ${MELLI_BASE_URL:-}
    ports:
      - "${API_PORT:-8080}:8080"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  web:
    build:
      context: ./frontend/Qasedak.Web
      dockerfile: Dockerfile
    environment:
      QASEDAK_API_INTERNAL_URL: http://api:8080
    ports:
      - "${WEB_PORT:-3000}:3000"
    depends_on:
      api:
        condition: service_started
    restart: unless-stopped

volumes:
  qasedak-postgres:
